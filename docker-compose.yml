version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: bidsure_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bidsure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bidsure123}
      POSTGRES_DB: ${POSTGRES_DB:-bidsure_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bidsure} -d ${POSTGRES_DB:-bidsure_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bidsure_backend
    restart: always
    environment:
      FLASK_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-bidsure}:${POSTGRES_PASSWORD:-bidsure123}@db:5432/${POSTGRES_DB:-bidsure_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-dev-secret-key-bidsure-2026}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
